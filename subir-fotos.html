<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Subir fotos — MCS Representaciones</title>
<style>
  :root{
    --dark:#121212; --gold:#C5A880; --bg:#FAF8F5; --border:#EDE8E0; --muted:#6B645E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--dark); padding:24px 16px 80px;
  }
  .wrap{max-width:560px;margin:0 auto;}
  h1{font-size:22px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13px;margin:0 0 28px;}
  label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  input[type=password], select{
    width:100%;padding:12px 14px;border:1px solid var(--border);background:#fff;
    font-size:14px;margin-bottom:20px;border-radius:2px;
  }
  .dropzone{
    border:2px dashed var(--border);background:#fff;padding:32px 16px;text-align:center;
    border-radius:4px;cursor:pointer;transition:border-color .2s,background .2s;margin-bottom:16px;
  }
  .dropzone.drag{border-color:var(--gold);background:#fffdf8;}
  .dropzone p{margin:0;font-size:13.5px;color:var(--muted);}
  .dropzone strong{color:var(--dark);}
  input[type=file]{display:none;}
  #preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-bottom:20px;}
  #preview .thumb{position:relative;aspect-ratio:1;border-radius:2px;overflow:hidden;border:1px solid var(--border);}
  #preview img{width:100%;height:100%;object-fit:cover;display:block;}
  #preview .thumb button{
    position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;
    width:20px;height:20px;border-radius:50%;font-size:12px;cursor:pointer;line-height:1;
  }
  button.main{
    width:100%;background:var(--dark);color:#fff;border:none;padding:15px;font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;font-weight:600;cursor:pointer;border-radius:2px;
  }
  button.main:disabled{opacity:.5;cursor:not-allowed;}
  #status{margin-top:16px;font-size:13px;text-align:center;color:var(--muted);white-space:pre-line;}
  #status.ok{color:#1a7a3c;font-weight:600;}
  #status.error{color:#b3261e;font-weight:600;}
  .bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:10px;display:none;}
  .bar-fill{height:100%;background:var(--gold);width:0%;transition:width .3s;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Subir fotos al catálogo</h1>
  <p class="sub">Arrastra varias fotos a la vez, elige la marca y súbelas de golpe.</p>

  <label>Contraseña</label>
  <input type="password" id="password" placeholder="Contraseña del panel de fotos" />

  <label>Marca</label>
  <select id="marca">
    <option value="treku">TREKU</option>
    <option value="baixmoduls">BAIXMODULS</option>
    <option value="tobisa">TOBISA</option>
    <option value="kingsofa">KINGSOFÁ</option>
    <option value="tapizadosmayor">TAPIZADOS MAYOR</option>
    <option value="essenzia">ESSENZIA DORMIRE</option>
  </select>

  <div class="dropzone" id="dropzone">
    <p><strong>Toca aquí</strong> o arrastra tus fotos<br/>(puedes seleccionar varias a la vez)</p>
  </div>
  <input type="file" id="fileInput" accept="image/*" multiple />

  <div id="preview"></div>

  <button class="main" id="uploadBtn" disabled>Subir fotos</button>
  <div class="bar" id="bar"><div class="bar-fill" id="barFill"></div></div>
  <div id="status"></div>
</div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const uploadBtn = document.getElementById('uploadBtn');
const statusEl = document.getElementById('status');
const bar = document.getElementById('bar');
const barFill = document.getElementById('barFill');

let selectedFiles = [];

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', (e) => addFiles(e.target.files));

function addFiles(fileList) {
  for (const f of fileList) {
    if (f.type.startsWith('image/')) selectedFiles.push(f);
  }
  renderPreview();
}

function renderPreview() {
  preview.innerHTML = '';
  selectedFiles.forEach((f, idx) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    const btn = document.createElement('button');
    btn.textContent = '×';
    btn.onclick = (ev) => { ev.stopPropagation(); selectedFiles.splice(idx, 1); renderPreview(); };
    div.appendChild(img);
    div.appendChild(btn);
    preview.appendChild(div);
  });
  uploadBtn.disabled = selectedFiles.length === 0;
}

function resizeImage(file, maxDim = 1600, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve(dataUrl.split(',')[1]);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const BATCH_SIZE = 3;

uploadBtn.addEventListener('click', async () => {
  const password = document.getElementById('password').value;
  const marca = document.getElementById('marca').value;

  if (!password) {
    setStatus('Escribe la contraseña.', 'error');
    return;
  }
  if (selectedFiles.length === 0) return;

  uploadBtn.disabled = true;
  bar.style.display = 'block';
  setStatus('Procesando fotos…', '');

  try {
    const batches = [];
    for (let i = 0; i < selectedFiles.length; i += BATCH_SIZE) {
      batches.push(selectedFiles.slice(i, i + BATCH_SIZE));
    }

    let subidas = 0;
    for (let b = 0; b < batches.length; b++) {
      const batch = batches[b];
      const files = await Promise.all(batch.map(async (f) => ({
        name: f.name,
        base64: await resizeImage(f)
      })));

      let res, data;
      try {
        res = await fetch('/.netlify/functions/subir-fotos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password, marca, files })
        });
        data = await res.json().catch(() => ({}));
      } catch (netErr) {
        throw new Error(`Fallo de red en la tanda ${b + 1} (foto ${subidas + 1} a ${subidas + batch.length}). Ya se subieron ${subidas} fotos correctamente. Vuelve a intentarlo con las fotos restantes.`);
      }

      if (!res.ok) {
        const detalle = data.error || `código ${res.status} (probablemente tardó demasiado)`;
        throw new Error(`Error en la tanda ${b + 1} (foto ${subidas + 1} a ${subidas + batch.length}): ${detalle}. Ya se subieron ${subidas} fotos correctamente. Quita las fotos ya subidas y reintenta con el resto.`);
      }

      subidas += data.subidas;
      barFill.style.width = Math.round((subidas / selectedFiles.length) * 100) + '%';
      setStatus(`Subidas ${subidas} de ${selectedFiles.length}…`, '');
    }

    setStatus(`✓ ${subidas} foto(s) subidas correctamente.\nEl catálogo se actualizará en unos minutos.`, 'ok');
    selectedFiles = [];
    renderPreview();
  } catch (err) {
    setStatus('Error: ' + err.message, 'error');
  } finally {
    uploadBtn.disabled = selectedFiles.length === 0;
  }
});

function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = cls || '';
}
</script>
</body>
</html>
