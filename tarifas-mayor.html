<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#2B2620">
<style>
  :root{
    --bg:#F5F2EC;
    --panel:#FFFFFF;
    --ink:#2B2620;
    --ink-soft:#6B6255;
    --line:#E4DCCB;
    --accent:#A9622F;
    --accent-dark:#7D4720;
    --accent-soft:#F0E2D0;
    --ok:#4B6B4F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:640px;margin:0 auto;padding-bottom:90px;}
  header.top{
    position:sticky;top:0;z-index:20;
    background:var(--ink);
    color:#F5F2EC;
    padding:14px 16px 12px;
  }
  header.top h1{
    margin:0;
    font-family:Georgia,"Times New Roman",serif;
    font-size:19px;
    font-weight:600;
    letter-spacing:.2px;
  }
  header.top .sub{
    font-size:12px;
    color:#C9BFA9;
    margin-top:2px;
    letter-spacing:.5px;
    text-transform:uppercase;
  }
  .top-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
  }
  .settings-btn{
    border:none;
    background:rgba(255,255,255,.08);
    color:#F5F2EC;
    width:34px;height:34px;
    border-radius:50%;
    font-size:16px;
    line-height:1;
    flex-shrink:0;
  }
  .settings-btn:active{background:rgba(255,255,255,.18);}
  .brand-strip{
    background:var(--panel);
    margin:14px 16px 0;
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 14px;
    display:flex;
    justify-content:center;
  }
  .brand-strip img{
    height:28px;
    width:auto;
    display:block;
  }
  .config{
    background:var(--panel);
    margin:14px 16px 0;
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
  }
  .config-row{
    display:flex;
    gap:10px;
    align-items:center;
  }
  .config-row + .config-row{margin-top:8px;}
  .config label{
    flex:1;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .config input{
    width:92px;
    padding:7px 8px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:15px;
    text-align:right;
    background:#FBF9F4;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .config .saved{
    font-size:11px;
    color:var(--ok);
    text-align:right;
    height:14px;
    margin-top:4px;
    opacity:0;
    transition:opacity .25s;
  }
  .config .saved.show{opacity:1;}

  .search-wrap{
    margin:14px 16px 6px;
    position:sticky;
    top:66px;
    z-index:15;
  }
  .search-wrap input{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid var(--line);
    font-size:15px;
    background:var(--panel);
    box-shadow:0 2px 6px rgba(43,38,32,.06);
  }
  .search-wrap input:focus{outline:2px solid var(--accent);}

  .hint{
    margin:8px 16px 4px;
    font-size:12.5px;
    color:var(--ink-soft);
  }

  .list{margin:8px 16px;}
  .coleccion{
    margin-top:14px;
  }
  .coleccion-h{
    font-family:Georgia,serif;
    font-size:13px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--accent-dark);
    padding:6px 2px;
    border-bottom:1px solid var(--line);
    margin-bottom:4px;
  }
  .subcol-h{
    font-size:12px;
    color:var(--ink-soft);
    padding:8px 2px 2px;
  }
  .item{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:6px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .item:active{background:var(--accent-soft);}
  .item .t{font-size:13.5px;line-height:1.35;}
  .item .id{font-size:10.5px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums;}

  .empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:13.5px;
    padding:40px 20px;
  }

  /* Modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(43,38,32,.5);
    z-index:50;
    display:none;
    align-items:flex-end;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--panel);
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    border-radius:18px 18px 0 0;
    padding:18px 18px 28px;
    animation:up .18s ease-out;
  }
  @keyframes up{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet h2{
    font-family:Georgia,serif;
    font-size:17px;
    margin:0 0 2px;
    padding-right:30px;
  }
  .sheet .meta{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .close-btn{
    position:absolute;
    right:16px;
    top:16px;
    width:32px;height:32px;
    border-radius:50%;
    border:none;
    background:var(--accent-soft);
    color:var(--accent-dark);
    font-size:16px;
    line-height:1;
  }
  .sheet-inner{position:relative;}

  table.tramos{
    width:100%;
    border-collapse:collapse;
    font-size:13.5px;
  }
  table.tramos th{
    text-align:right;
    font-size:10.5px;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding:4px 6px;
    border-bottom:1px solid var(--line);
  }
  table.tramos th:first-child{text-align:left;}
  table.tramos td{
    padding:8px 6px;
    text-align:right;
    border-bottom:1px solid var(--line);
    font-variant-numeric:tabular-nums;
  }
  table.tramos td:first-child{
    text-align:left;
    font-weight:700;
    color:var(--accent-dark);
  }
  table.tramos td.neto{
    font-weight:700;
    color:var(--ink);
  }
  .copy-row{
    display:flex;
    justify-content:flex-end;
    padding:6px;
  }
  .copy-row button{
    border:none;
    background:none;
    color:var(--accent);
    font-size:11px;
    padding:2px 4px;
  }
  .foot-note{
    margin-top:14px;
    font-size:11.5px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .toast{
    position:fixed;
    bottom:18px;left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#F5F2EC;
    padding:9px 16px;
    border-radius:20px;
    font-size:13px;
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s;
  }
  .toast.show{opacity:1;}

  /* Guided selector */
  .model-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .model-btn{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 10px;
    text-align:center;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
  }
  .model-btn:active{background:var(--accent-soft);}
  .model-btn .count{
    display:block;
    font-weight:400;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .back-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:14px 16px 6px;
  }
  .back-btn{
    border:none;background:none;
    color:var(--accent-dark);
    font-size:13.5px;
    font-weight:600;
    padding:4px 0;
  }
  .facets{
    margin:0 16px 4px;
  }
  .facet-group{
    margin-bottom:10px;
  }
  .facet-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .chip{
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:20px;
    padding:6px 12px;
    font-size:12.5px;
    color:var(--ink);
  }
  .chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
</style>
</head>

ion":"VANGUARDIA","subcol":"TOMMY (deslizantes de carro y pata alta)","puntos":{"O":320,"A":340,"B":360,"C":380,"D":400}},{"id":70574,"titulo":"MÓDULO TERMINAL FIJO 120 CM.","coleccion":"VANGUARDIA","subcol":"TOMMY (deslizantes de carro y pata alta)","puntos":{"O":270,"A":290,"B":310,"C":330,"D":350}}];</script>
<script>
const SERIE_ORDER = ['O','A','B','C','D'];

let config = { valorPunto: 1.15 };

async function loadConfig(){
  try{
    const r = await window.storage.get('config');
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      config = Object.assign(config, parsed);
    }
  }catch(e){ /* no guardado aún, usamos defaults */ }
  document.getElementById('valorPunto').value = config.valorPunto;
}

let saveTimer=null;
async function saveConfig(){
  config.valorPunto = parseFloat(document.getElementById('valorPunto').value) || 0;
  try{
    await window.storage.set('config', JSON.stringify(config));
    const msg = document.getElementById('savedMsg');
    msg.classList.add('show');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>msg.classList.remove('show'), 900);
  }catch(e){ console.error('No se pudo guardar', e); }
  if(currentModalId!==null) renderModal(currentModalId);
}

document.getElementById('valorPunto').addEventListener('change', saveConfig);

const settingsBtn = document.getElementById('settingsBtn');
const configPanel = document.getElementById('configPanel');
settingsBtn.addEventListener('click', ()=>{
  const isHidden = configPanel.style.display === 'none';
  configPanel.style.display = isHidden ? 'block' : 'none';
});

function fmt(n){
  return n.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
}

function calc(puntos){
  return puntos * config.valorPunto;
}

// --- Modelos y atributos derivados ---
const listEl = document.getElementById('list');
const searchEl = document.getElementById('search');
const resultCountEl = document.getElementById('resultCount');
const modelStepEl = document.getElementById('modelStep');
const modelGridEl = document.getElementById('modelGrid');
const backRowEl = document.getElementById('backRow');
const modelNameEl = document.getElementById('modelName');
const facetsEl = document.getElementById('facets');

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Deriva atributos de cada producto a partir de su título, una sola vez.
PRODUCTOS.forEach(p=>{
  const t = p.titulo.toUpperCase();
  p._modelKey = p.subcol || p.coleccion || 'OTROS';
  p._tipo = t.includes('SILLÓN') || t.includes('SILLON') ? 'Sillón'
          : t.includes('MÓDULO') || t.includes('MODULO') ? 'Módulo'
          : t.includes('POUFF') ? 'Pouff'
          : 'Sofá';
  p._cabezal = (/CABEZ/.test(t) && /MOTOR/.test(t)) ? 'Cabezal motorizado'
             : (/CABEZ/.test(t) && t.includes('MANUAL')) ? 'Cabezal manual'
             : null;
  p._chaise = /CHAI/.test(t) ? (
                t.includes('RINCON') || t.includes('RINCÓN') ? 'Cheslón rinconera'
              : t.includes('ARCÓN') || t.includes('ARCON') ? 'Cheslón con arcón'
              : 'Cheslón fija'
              ) : 'Sin cheslón';
  p._orientacion = t.includes('V/F.IZQ') || t.includes('V/F IZQ') ? 'Izquierda'
                  : t.includes('V/F.DCHA') || t.includes('V/F DCHA') ? 'Derecha'
                  : null;
  p._baseTitulo = p.titulo
    .replace(/V\/F\.?\s*IZQ\.?/i, '')
    .replace(/V\/F\.?\s*DCHA\.?/i, '')
    .replace(/\s{2,}/g, ' ')
    .replace(/\s+([.,])/g, '$1')
    .trim();
  const medidas = [...t.matchAll(/(\d{2,3})\s?CM/g)].map(m=>parseInt(m[1]));
  p._medidas = [...new Set(medidas)];
});

// --- Paso 1: selección de modelo ---
function buildModelGrid(){
  const counts = {};
  PRODUCTOS.forEach(p=>{ counts[p._modelKey] = (counts[p._modelKey]||0) + 1; });
  const keys = Object.keys(counts).sort((a,b)=>a.localeCompare(b,'es'));
  modelGridEl.innerHTML = keys.map(k=>
    `<button class="model-btn" data-model="${escapeHtml(k)}">${escapeHtml(k.replace(/\s*\(.*\)$/,''))}<span class="count">${counts[k]} artículos</span></button>`
  ).join('');
  modelGridEl.querySelectorAll('.model-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> selectModel(btn.dataset.model));
  });
}

let currentModel = null;
let facetState = { tipo:null, cabezal:null, chaise:null, medida:null };

function selectModel(modelKey){
  currentModel = modelKey;
  facetState = { tipo:null, cabezal:null, chaise:null, medida:null };
  modelStepEl.style.display = 'none';
  backRowEl.style.display = 'flex';
  modelNameEl.textContent = modelKey.replace(/\s*\(.*\)$/,'');
  facetsEl.style.display = 'block';
  searchEl.value = '';
  renderFacetsAndList();
}

document.getElementById('backBtn').addEventListener('click', ()=>{
  currentModel = null;
  modelStepEl.style.display = 'block';
  backRowEl.style.display = 'none';
  facetsEl.style.display = 'none';
  listEl.innerHTML = '';
  resultCountEl.textContent = '';
});

function itemsForModel(){
  return PRODUCTOS.filter(p=>p._modelKey === currentModel);
}

function applyFacets(items){
  return items.filter(p=>{
    if(facetState.tipo && p._tipo !== facetState.tipo) return false;
    if(facetState.cabezal && p._cabezal !== facetState.cabezal) return false;
    if(facetState.chaise && p._chaise !== facetState.chaise) return false;
    if(facetState.medida && !p._medidas.includes(facetState.medida)) return false;
    return true;
  });
}

function renderFacetsAndList(){
  const base = itemsForModel();

  function distinctValues(key, getter){
    const vals = new Set();
    base.forEach(p=>{ const v = getter(p); if(v!==null && v!==undefined) vals.add(v); });
    return [...vals];
  }

  const tipos = distinctValues('tipo', p=>p._tipo);
  const cabezales = distinctValues('cabezal', p=>p._cabezal);
  const chaises = distinctValues('chaise', p=>p._chaise);
  const medidasAll = new Set();
  base.forEach(p=>p._medidas.forEach(m=>medidasAll.add(m)));
  const medidas = [...medidasAll].sort((a,b)=>a-b);

  let html = '';
  function chipGroup(label, values, current, onKey){
    if(values.length <= 1) return '';
    html += `<div class="facet-group"><div class="facet-label">${label}</div><div class="chip-row">`;
    html += `<button class="chip ${current===null?'active':''}" data-facet="${onKey}" data-value="">Todos</button>`;
    values.forEach(v=>{
      html += `<button class="chip ${current===v?'active':''}" data-facet="${onKey}" data-value="${escapeHtml(String(v))}">${escapeHtml(String(v))}${onKey==='medida'?' cm':''}</button>`;
    });
    html += `</div></div>`;
  }

  chipGroup('Tipo', tipos, facetState.tipo, 'tipo');
  chipGroup('Cabezal', cabezales, facetState.cabezal, 'cabezal');
  chipGroup('Cheslón', chaises, facetState.chaise, 'chaise');
  chipGroup('Medida asiento', medidas, facetState.medida, 'medida');

  facetsEl.innerHTML = html;
  facetsEl.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const key = chip.dataset.facet;
      const raw = chip.dataset.value;
      facetState[key] = raw === '' ? null : (key==='medida' ? parseInt(raw) : raw);
      renderFacetsAndList();
    });
  });

  renderList(applyFacets(base));
}

function dedupeOrientacion(items){
  const seen = new Map();
  const result = [];
  items.forEach(p=>{
    const key = p._baseTitulo;
    if(seen.has(key)){
      const existing = seen.get(key);
      if(p._orientacion && existing._orientacion && p._orientacion !== existing._orientacion){
        existing._bothOrientations = true;
      }
      return;
    }
    seen.set(key, p);
    result.push(p);
  });
  return result;
}

function renderList(items){
  items = dedupeOrientacion(items);
  if(items.length === 0){
    listEl.innerHTML = '<div class="empty">Ninguna composición cumple esos filtros. Prueba a quitar alguno.</div>';
    resultCountEl.textContent = '0 resultados';
    return;
  }
  resultCountEl.textContent = `${items.length} resultado(s)`;
  let html = '';
  items.forEach(p=>{
    const label = escapeHtml(p._orientacion ? p._baseTitulo : p.titulo) + (p._bothOrientations ? ' <span style="color:var(--ink-soft);font-weight:400;">(izq. o dcha., mismo precio)</span>' : '');
    html += `<div class="item" data-id="${p.id}"><span class="t">${label}</span><span class="id">#${p.id}</span></div>`;
  });
  listEl.innerHTML = html;
  listEl.querySelectorAll('.item').forEach(el=>{
    el.addEventListener('click', ()=> openModal(parseInt(el.dataset.id)));
  });
}

// --- Búsqueda libre (sin modelo seleccionado) ---
function renderFreeSearch(filterText){
  const q = (filterText||'').trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  if(words.length === 0){
    listEl.innerHTML = '';
    resultCountEl.textContent = '';
    return;
  }
  const items = PRODUCTOS.filter(p=>{
    const haystack = [p.titulo, p.coleccion, p.subcol, String(p.id)].filter(Boolean).join(' ').toLowerCase();
    return words.every(w => haystack.includes(w));
  }).slice(0, 200);
  renderList(items);
  if(items.length>0) resultCountEl.textContent = `${items.length}${items.length===200?'+':''} resultado(s)`;
}

let debounceT=null;
searchEl.addEventListener('input', ()=>{
  clearTimeout(debounceT);
  debounceT = setTimeout(()=>{
    if(searchEl.value.trim()){
      // La búsqueda libre siempre opera sobre todo el catálogo, sale del modo modelo
      currentModel = null;
      modelStepEl.style.display = 'none';
      backRowEl.style.display = 'none';
      facetsEl.style.display = 'none';
      renderFreeSearch(searchEl.value);
    } else if(!currentModel){
      modelStepEl.style.display = 'block';
      listEl.innerHTML = '';
      resultCountEl.textContent = '';
    }
  }, 120);
});

// --- Modal ---
const overlay = document.getElementById('overlay');
const modalTitle = document.getElementById('modalTitle');
const modalMeta = document.getElementById('modalMeta');
const modalBody = document.getElementById('modalBody');
let currentModalId = null;

function findProduct(id){
  return PRODUCTOS.find(p=>p.id===id);
}

function renderModal(id){
  const p = findProduct(id);
  if(!p) return;
  modalTitle.textContent = p._orientacion ? p._baseTitulo : p.titulo;
  modalMeta.textContent = `Art. #${p.id} · ${p.coleccion}${p.subcol ? ' · ' + p.subcol : ''}${p._bothOrientations ? ' · disponible izq. o dcha. (mismo precio)' : ''}`;
  let rows = '';
  SERIE_ORDER.forEach(s=>{
    if(p.puntos[s] === undefined) return;
    const puntos = p.puntos[s];
    const precio = calc(puntos);
    rows += `<tr><td>${s}</td><td>${puntos}</td><td class="neto">${fmt(precio)}</td></tr>`;
  });
  modalBody.innerHTML = rows;
}

function openModal(id){
  currentModalId = id;
  renderModal(id);
  overlay.classList.add('open');
}
function closeModal(){
  overlay.classList.remove('open');
  currentModalId = null;
}
document.getElementById('closeBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });

document.getElementById('copyBtn').addEventListener('click', ()=>{
  const p = findProduct(currentModalId);
  if(!p) return;
  let text = `${p.titulo} (Art. ${p.id})\n`;
  SERIE_ORDER.forEach(s=>{
    if(p.puntos[s]===undefined) return;
    const precio = calc(p.puntos[s]);
    text += `Tramo ${s}: ${fmt(precio)}\n`;
  });
  navigator.clipboard.writeText(text).then(()=>{
    showToast('Precios copiados');
  }).catch(()=>{
    showToast('No se pudo copiar');
  });
});

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

loadConfig().then(()=> buildModelGrid());
</script>

</body>
</html>
