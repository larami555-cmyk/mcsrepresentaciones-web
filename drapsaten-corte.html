<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex, nofollow">
<title>DRAPSATEN CORTE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14151b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DRAPSATEN CORTE">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="32x32" href="./images/icon-drapsaten-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./images/icon-drapsaten-180.png">
<link rel="manifest" href="./manifest-drapsaten.json">
<style>
:root{
  --bg:#f4f0e8;
  --card:#ffffff;
  --ink:#1c1c22;
  --ink-soft:#6f6a60;
  --label:#8c8577;
  --navy:#1f2a44;
  --navy-soft:#3c4a6b;
  --line:#e7e1d4;
  --header-1:#1b1c22;
  --header-2:#0a0a0d;
  --gold:#a9895f;
  --tag-bg:#eef1f6;
  --radius:16px;
  --shadow:0 1px 2px rgba(20,18,10,.04), 0 8px 20px -12px rgba(20,18,10,.18);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
  padding-bottom:40px;
}
::selection{background:#d8cdb2;}

/* ---------- header ---------- */
header.app{
  background:linear-gradient(155deg, var(--header-1), var(--header-2) 75%);
  color:#f4f0e8;
  padding:22px 20px 26px;
  border-radius:0 0 28px 28px;
  position:relative;
  overflow:hidden;
}
header.app::after{
  content:"";
  position:absolute; right:-40px; top:-60px;
  width:180px; height:180px; border-radius:50%;
  background:radial-gradient(circle, rgba(169,137,95,.20), transparent 70%);
}
.brand-row{display:flex; align-items:center; gap:12px; position:relative; z-index:1;}
.brand-mark{
  width:40px; height:40px; border-radius:11px;
  background:#111219;
  border:1px solid rgba(255,255,255,.08);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.brand-mark svg{width:22px; height:22px;}
.brand-text h1{
  margin:0; font-size:20px; letter-spacing:.04em; font-weight:700;
}
.brand-text p{
  margin:2px 0 0; font-size:12.5px; color:#b9b3a4; letter-spacing:.02em;
}
.header-sub{
  margin:16px 2px 0; font-size:13px; color:#c8c2b2; line-height:1.5; max-width:34ch; position:relative; z-index:1;
}

/* ---------- search & filters ---------- */
main{padding:16px 16px 0; max-width:520px; margin:0 auto;}
.search-wrap{margin-top:-16px; position:relative; z-index:2;}
.search-wrap input{
  width:100%; padding:14px 16px; border-radius:14px; border:1px solid var(--line);
  background:var(--card); font-size:15px; color:var(--ink);
  box-shadow:var(--shadow);
}
.search-wrap input::placeholder{color:#a19b8c;}

.filters{
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:16px; margin-top:14px; border:1px solid var(--line);
}
.filters-toggle{
  display:flex; align-items:center; justify-content:space-between;
  cursor:pointer; user-select:none;
}
.filters-toggle .count{
  font-size:12px; color:var(--navy-soft); background:var(--tag-bg);
  padding:3px 9px; border-radius:20px; font-weight:600;
}
.filters-toggle h2{font-size:14px; margin:0; letter-spacing:.02em;}
.filters-toggle .chev{transition:transform .2s ease; color:var(--label);}
.filters-body{
  display:grid; grid-template-rows:0fr; transition:grid-template-rows .25s ease;
}
.filters-body.open{grid-template-rows:1fr;}
.filters-body > div{overflow:hidden;}
.filters-inner{padding-top:16px;}

.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;}
.field label{
  display:block; font-size:10.5px; letter-spacing:.08em; color:var(--label);
  font-weight:700; margin-bottom:6px; text-transform:uppercase;
}
.field select{
  width:100%; padding:11px 12px; border-radius:11px; border:1px solid var(--line);
  background:#fff; font-size:14.5px; color:var(--ink); appearance:none;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%23807a6c" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>');
  background-repeat:no-repeat; background-position:right 10px center;
}
.field.order select{border-color:var(--navy); font-weight:600;}

.tags{display:flex; flex-wrap:wrap; gap:8px; margin-top:2px;}
.tag-chip{
  padding:8px 13px; border-radius:20px; border:1px solid var(--navy-soft);
  color:var(--navy); font-size:13px; background:#fff; cursor:pointer;
  transition:background .15s ease, color .15s ease;
}
.tag-chip.active{background:var(--navy); color:#fff; border-color:var(--navy);}

.clear-filters{
  margin-top:14px; text-align:center; font-size:12.5px; color:var(--ink-soft);
  text-decoration:underline; cursor:pointer;
}

/* ---------- product list ---------- */
.models-section{margin-top:18px;}
.models-section .sec-title{
  font-size:13px; color:var(--ink-soft); margin:0 0 10px 2px; font-weight:600;
}
.models-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.model-tile{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  box-shadow:var(--shadow); padding:14px 14px 13px; cursor:pointer;
}
.model-tile .tile-name{font-size:15px; font-weight:700; color:var(--ink); line-height:1.25;}
.model-tile .tile-sub{font-size:12px; color:var(--ink-soft); margin-top:4px;}

.results-meta{
  margin:18px 2px 10px; font-size:12.5px; color:var(--ink-soft);
}
.grid{display:flex; flex-direction:column; gap:14px; padding-bottom:10px;}

.card{
  background:var(--card); border-radius:20px; box-shadow:var(--shadow);
  border:1px solid var(--line); overflow:hidden; cursor:pointer;
}
.card-media{position:relative; aspect-ratio:16/9; background:#eee; overflow:hidden;}
.card-media img{width:100%; height:100%; object-fit:cover; display:block;}
.card-media .zoom-hint{
  position:absolute; right:10px; bottom:10px; background:rgba(15,16,21,.55);
  color:#fff; font-size:11px; padding:5px 9px; border-radius:20px;
  display:flex; align-items:center; gap:5px; backdrop-filter:blur(2px);
}
.card-media .zoom-hint svg{width:12px; height:12px;}
.card-media .badge{
  position:absolute; left:10px; top:10px; background:rgba(244,240,232,.92);
  color:var(--navy); font-size:10.5px; font-weight:700; letter-spacing:.03em;
  padding:5px 10px; border-radius:20px;
}
.card-body{padding:14px 16px 16px;}
.card-title-row{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
.card-title-row h3{margin:0; font-size:17px; letter-spacing:.01em;}
.firmness-pill{
  font-size:10.5px; color:var(--navy-soft); background:var(--tag-bg);
  padding:3px 8px; border-radius:20px; white-space:nowrap; font-weight:600;
}
.card-spec{font-size:13px; color:var(--ink-soft); margin-top:5px; line-height:1.45;}
.card-dims{font-size:12px; color:#948e7f; margin-top:6px;}
.card-divider{height:1px; background:var(--line); margin:12px 0;}
.card-price-row{display:flex; align-items:center; justify-content:space-between;}
.price-block{display:flex; align-items:baseline; gap:6px;}
.price-value{font-size:22px; font-weight:700; color:var(--navy); letter-spacing:-.01em;}
.price-edit{
  border:none; background:none; color:var(--gold); font-size:12px;
  display:flex; align-items:center; gap:4px; padding:6px 4px; cursor:pointer;
}
.price-edit svg{width:13px; height:13px;}
.price-unset{color:#a89b7d; font-size:13px; font-style:italic;}

.empty-state{
  text-align:center; padding:50px 20px; color:var(--ink-soft);
}
.empty-state svg{width:38px; height:38px; color:var(--label); margin-bottom:10px;}

/* ---------- detail sheet ---------- */
.sheet-overlay{
  position:fixed; inset:0; background:var(--bg); z-index:50;
  transform:translateY(100%); transition:transform .32s cubic-bezier(.32,.72,0,1);
  overflow-y:auto;
}
.sheet-overlay.open{transform:translateY(0);}
.sheet-hero{position:relative;}
.sheet-hero img{width:100%; display:block; aspect-ratio:4/3; object-fit:cover;}
.sheet-back{
  position:absolute; top:16px; left:16px; width:38px; height:38px; border-radius:50%;
  background:rgba(15,16,21,.55); color:#fff; border:none; display:flex;
  align-items:center; justify-content:center; backdrop-filter:blur(2px);
}
.sheet-expand{
  position:absolute; bottom:14px; right:14px; background:rgba(15,16,21,.6); color:#fff;
  border:none; font-size:12px; padding:8px 13px; border-radius:20px; display:flex; gap:6px; align-items:center;
}
.sheet-expand svg{width:13px; height:13px;}
.sheet-content{padding:20px 20px 60px; max-width:520px; margin:0 auto;}
.sheet-eyebrow{font-size:11px; letter-spacing:.08em; color:var(--gold); font-weight:700; text-transform:uppercase;}
.sheet-content h2{margin:6px 0 4px; font-size:25px;}
.sheet-fw{font-size:13.5px; color:var(--ink-soft); margin-bottom:18px;}
.sheet-section{margin-bottom:20px;}
.sheet-section h4{
  font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--label);
  margin:0 0 8px; font-weight:700;
}
.sheet-section p{margin:0 0 6px; font-size:14.5px; line-height:1.55; color:var(--ink);}
.feature-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.feature-item{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:10px 12px; font-size:13px; color:var(--ink); display:flex; align-items:center; gap:8px;
}
.feature-item svg{width:15px; height:15px; color:var(--navy-soft); flex-shrink:0;}
.dim-chip-row{display:flex; flex-wrap:wrap; gap:6px;}
.dim-chip{
  font-size:12.5px; background:var(--tag-bg); color:var(--navy-soft);
  padding:5px 10px; border-radius:8px;
}
.sheet-actions{display:flex; gap:10px; margin:16px 0 4px;}
.sheet-action-btn{
  flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
  padding:11px 10px; border-radius:12px; border:1px solid var(--navy-soft);
  background:#fff; color:var(--navy); font-size:13.5px; font-weight:600; cursor:pointer;
}
.sheet-action-btn.solid{background:var(--navy); color:#fff; border-color:var(--navy);}
.sheet-action-btn svg{width:16px; height:16px; flex-shrink:0;}
.sheet-action-btn:disabled{opacity:.5;}

.export-card{
  position:fixed; left:-9999px; top:0; width:720px; background:#fdfbf6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:#1c1c22;
}
.export-card .ec-header{
  background:linear-gradient(155deg, #1b1c22, #0a0a0d 75%); color:#f4f0e8;
  padding:26px 32px; display:flex; align-items:center; gap:14px;
}
.export-card .ec-header img{width:46px; height:46px; border-radius:12px; object-fit:cover;}
.export-card .ec-header .ec-title{font-size:22px; font-weight:700; letter-spacing:.02em;}
.export-card .ec-header .ec-sub{font-size:12.5px; color:#c8c2b2; margin-top:2px;}
.export-card .ec-hero{width:100%; height:380px; object-fit:cover; display:block;}
.export-card .ec-body{padding:28px 32px 34px;}
.export-card .ec-eyebrow{font-size:12px; letter-spacing:.07em; color:#a9895f; font-weight:700; text-transform:uppercase;}
.export-card .ec-name{font-size:32px; font-weight:700; margin:6px 0 2px;}
.export-card .ec-fw{font-size:15px; color:#6f6a60; margin-bottom:20px;}
.export-card .ec-row{display:flex; gap:28px; margin-bottom:22px;}
.export-card .ec-col h4{font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:#8c8577; margin:0 0 8px;}
.export-card .ec-col p{font-size:14px; line-height:1.55; margin:0 0 4px;}
.export-card .ec-feats{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
.export-card .ec-feat{background:#eef1f6; color:#3c4a6b; font-size:12.5px; padding:6px 12px; border-radius:20px;}
.export-card .ec-dims{font-size:13.5px; color:#6f6a60; margin-top:4px;}
.export-card .ec-price{
  margin-top:8px; background:#1f2a44; color:#fff; border-radius:14px; padding:16px 20px;
  display:flex; align-items:center; justify-content:space-between;
}
.export-card .ec-price .lbl{font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:#b9c3dd;}
.export-card .ec-price .val{font-size:26px; font-weight:700;}
.export-card .ec-footer{font-size:11.5px; color:#a79f8c; text-align:center; padding:16px 0 26px;}

.sheet-price-card{
  background:var(--navy); color:#fff; border-radius:16px; padding:16px 18px; margin-top:22px;
}
.sheet-price-card .lbl{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#b9c3dd;}
.sheet-price-card .val{font-size:26px; font-weight:700; margin-top:4px;}
.sheet-price-card input{
  margin-top:10px; width:100%; padding:10px 12px; border-radius:10px; border:none;
  font-size:14px; color:var(--ink);
}
.sheet-price-card .save-btn{
  margin-top:8px; width:100%; padding:10px; border-radius:10px; border:none;
  background:var(--gold); color:#1c1c22; font-weight:700; font-size:13.5px;
}

/* fullscreen image viewer */
.fs-viewer{
  position:fixed; inset:0; background:#000; z-index:60; display:none;
  align-items:center; justify-content:center;
}
.fs-viewer.open{display:flex;}
.fs-viewer img{width:100%; height:100%; object-fit:contain;}
.fs-close{
  position:absolute; top:18px; right:18px; width:38px; height:38px; border-radius:50%;
  background:rgba(255,255,255,.12); color:#fff; border:none; display:flex;
  align-items:center; justify-content:center;
}

footer.credit{
  text-align:center; font-size:11px; color:#a79f8c; padding:26px 16px 6px;
}
</style>
</head>
<body>

<header class="app">
  <div class="brand-row">
    <div class="brand-mark" style="overflow:hidden; padding:0;">
      <img src="./images/icon-drapsaten-192.png" alt="MCS Representaciones" style="width:100%; height:100%; object-fit:cover;">
    </div>
    <div class="brand-text">
      <h1>DRAPSATEN CORTE</h1>
      <p>SweetBedding · Colección de colchones</p>
    </div>
  </div>
  <p class="header-sub">Fichas técnicas al detalle: composición, altura, medidas y precio de cada modelo.</p>
</header>

<main>
  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="Buscar modelo…" autocomplete="off">
  </div>

  <div class="filters">
    <div class="filters-toggle" id="filtersToggle">
      <h2>Filtros</h2>
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="count" id="activeCount" style="display:none;">0</span>
        <svg class="chev" id="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6f6a60" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>
    <div class="filters-body" id="filtersBody"><div><div class="filters-inner">

      <div class="field-row">
        <div class="field">
          <label>Ancho</label>
          <select id="fAncho"><option value="">Cualquiera</option></select>
        </div>
        <div class="field">
          <label>Largo</label>
          <select id="fLargo"><option value="">Cualquiera</option></select>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Altura desde</label>
          <select id="fAlturaDesde"><option value="">Sin mínimo</option></select>
        </div>
        <div class="field">
          <label>Altura hasta</label>
          <select id="fAlturaHasta"><option value="">Sin máximo</option></select>
        </div>
      </div>

      <div class="field-row" style="grid-template-columns:1fr;">
        <div class="field order">
          <label>Orden</label>
          <select id="fOrden">
            <option value="nombre">Nombre A–Z</option>
            <option value="altura">Altura</option>
          </select>
        </div>
      </div>

      <div class="field" style="margin-bottom:0;">
        <label>Composición</label>
        <div class="tags" id="compTags"></div>
      </div>

      <div class="clear-filters" id="clearFilters">Borrar filtros</div>
    </div></div></div>
  </div>

  <div class="models-section">
    <p class="sec-title">Elige un modelo</p>
    <div class="models-grid" id="modelsGrid"></div>
  </div>

  <div class="results-meta" id="resultsMeta"></div>
  <div class="grid" id="grid"></div>
</main>

<footer class="credit">DRAPSATEN CORTE · MCS Representaciones</footer>

<!-- product detail sheet -->
<div class="sheet-overlay" id="sheet">
  <div class="sheet-hero">
    <img id="sheetImg" src="" alt="">
    <button class="sheet-back" id="sheetBack">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="sheet-expand" id="sheetExpand">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M9 3H5a2 2 0 0 0-2 2v4M15 3h4a2 2 0 0 1 2 2v4M9 21H5a2 2 0 0 1-2-2v-4M15 21h4a2 2 0 0 0 2-2v-4"/></svg>
      Pantalla completa
    </button>
  </div>
  <div class="sheet-content" id="sheetContent"></div>
</div>

<!-- fullscreen viewer -->
<div class="fs-viewer" id="fsViewer">
  <button class="fs-close" id="fsClose">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <img id="fsImg" src="" alt="">
</div>

<!-- hidden printable ficha, used to generate the shareable/downloadable image -->
<div class="export-card" id="exportCard"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>

/* ================= INIT SELECTS ================= */
function uniqueSorted(arr){
  return [...new Set(arr)].sort((a,b)=>{
    const an = parseInt(a), bn = parseInt(b);
    if(!isNaN(an) && !isNaN(bn)) return an-bn;
    return String(a).localeCompare(String(b));
  });
}
function fillSelect(sel, values, suffix){
  values.forEach(v=>{
    const opt = document.createElement("option");
    opt.value = v; opt.textContent = v + (suffix||"");
    sel.appendChild(opt);
  });
}
const allAncho = uniqueSorted(PRODUCTS.flatMap(p=>p.ancho));
const allLargo = uniqueSorted(PRODUCTS.flatMap(p=>p.largo));
const allAlturas = uniqueSorted(PRODUCTS.map(p=>p.altura));

fillSelect(document.getElementById("fLargo"), allLargo, " cm");
fillSelect(document.getElementById("fAlturaDesde"), allAlturas, " cm");
fillSelect(document.getElementById("fAlturaHasta"), allAlturas, " cm");

const allComp = uniqueSorted(PRODUCTS.flatMap(p=>p.composicion));

allComp.forEach(c=>{
  const chip = document.createElement("div");
  chip.className = "tag-chip";
  chip.textContent = c;
  chip.addEventListener("click", ()=>{
    if(state.comp.has(c)) state.comp.delete(c); else state.comp.add(c);
    chip.classList.toggle("active");
    render();
  });
  compTagsEl.appendChild(chip);
});

/* ================= RENDER LIST ================= */
function activeFilterCount(){
  let n=0;
  if(state.ancho) n++;
  if(state.largo) n++;
  if(state.alturaDesde) n++;
  if(state.alturaHasta) n++;
  n += state.comp.size;
  return n;
}

function matches(p){
  if(state.search && !p.name.toLowerCase().includes(state.search)) return false;
  if(state.ancho && !p.ancho.map(String).includes(state.ancho)) return false;
  if(state.largo && !p.largo.map(String).includes(state.largo)) return false;
  if(state.alturaDesde && p.altura < parseInt(state.alturaDesde)) return false;
  if(state.alturaHasta && p.altura > parseInt(state.alturaHasta)) return false;
  if(state.comp.size){
    const ok = [...state.comp].every(c=>p.composicion.includes(c));
    if(!ok) return false;
  }
  return true;
}

function render(){
  const cnt = document.getElementById("activeCount");
  const n = activeFilterCount();
  cnt.style.display = n>0 ? "inline-block" : "none";
  cnt.textContent = n;

  let list = PRODUCTS.filter(matches);
  if(state.orden === "nombre") list.sort((a,b)=>a.name.localeCompare(b.name));
  else if(state.orden === "altura") list.sort((a,b)=>a.altura-b.altura);

  document.getElementById("resultsMeta").textContent =
    list.length + (list.length===1 ? " modelo encontrado" : " modelos encontrados");

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  if(list.length===0){
    grid.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <div>No hay modelos con esos filtros.</div>
    </div>`;
    return;
  }

  list.forEach(p=>{
    const price = prices[p.id];
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-media" data-open="${p.id}">
        <img src="${p.img}" alt="${p.name}">
        <div class="badge">${p.fabricacion.includes("El Corte") ? "El Corte Inglés" : ""}</div>
        <div class="zoom-hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M9 3H5a2 2 0 0 0-2 2v4M15 3h4a2 2 0 0 1 2 2v4M9 21H5a2 2 0 0 1-2-2v-4M15 21h4a2 2 0 0 0 2-2v-4"/></svg>
          Ver ficha
        </div>
      </div>
      <div class="card-body">
        <div class="card-title-row">
          <h3>${p.name}</h3>
          <span class="firmness-pill">${p.firmeza}</span>
        </div>
        <div class="card-spec">${p.resumen}</div>
        <div class="card-dims">${p.altura} cm de alto · ancho ${p.ancho[0]}–${p.ancho[p.ancho.length-1]} cm</div>
        <div class="card-divider"></div>
        <div class="card-price-row">
          <div class="price-block">
            ${price ? `<span class="price-value">${Number(price).toFixed(2)} €</span>` : `<span class="price-unset">Precio sin fijar</span>`}
          </div>
          <button class="price-edit" data-edit="${p.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
            ${price ? "Editar" : "Fijar precio"}
          </button>
        </div>
      </div>
    `;
    card.querySelector(".card-media").addEventListener("click", ()=>openSheet(p.id));
    card.querySelector(".card-body h3").addEventListener("click", ()=>openSheet(p.id));
    card.querySelector(".card-spec").addEventListener("click", ()=>openSheet(p.id));
    card.querySelector(".price-edit").addEventListener("click", (e)=>{
      e.stopPropagation();
      editPrice(p.id);
    });
    grid.appendChild(card);
  });
}

function editPrice(id){
  const current = prices[id] || "";
  const val = prompt("Precio (€) para este modelo:", current);
  if(val === null) return;
  const num = parseFloat(val.replace(",","."));
  if(isNaN(num)){ return; }
  prices[id] = num;
  localStorage.setItem("drapsaten_prices", JSON.stringify(prices));
  render();
}

/* ================= DETAIL SHEET ================= */
const sheet = document.getElementById("sheet");
const sheetImg = document.getElementById("sheetImg");
const sheetContent = document.getElementById("sheetContent");
let currentProduct = null;

function openSheet(id){
  const p = PRODUCTS.find(x=>x.id===id);
  if(!p) return;
  currentProduct = p;
  sheetImg.src = p.img;
  const price = prices[p.id];

  sheetContent.innerHTML = `
    <div class="sheet-eyebrow">${p.fabricacion}</div>
    <h2>${p.name}</h2>
    <div class="sheet-fw">${p.firmeza} · ${p.altura} cm de altura</div>

    <div class="sheet-actions">
      <button class="sheet-action-btn" id="btnDownloadFicha">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
        Descargar ficha
      </button>
      <button class="sheet-action-btn solid" id="btnShareFicha">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
        Compartir
      </button>
    </div>

    <div class="sheet-section">
      <h4>Núcleo</h4>
      ${p.nucleo.map(t=>`<p>${t}</p>`).join("")}
    </div>

    <div class="sheet-section">
      <h4>Funda exterior</h4>
      ${p.funda.map(t=>`<p>${t}</p>`).join("")}
    </div>

    <div class="sheet-section">
      <h4>Características</h4>
      <div class="feature-grid">
        ${p.caracteristicas.map(c=>`<div class="feature-item">${ICONS.default}<span>${c}</span></div>`).join("")}
      </div>
    </div>

    <div class="sheet-section">
      <h4>Ancho disponible</h4>
      <div class="dim-chip-row">${p.ancho.map(a=>`<span class="dim-chip">${a} cm</span>`).join("")}</div>
    </div>

    <div class="sheet-section">
      <h4>Largo disponible</h4>
      <div class="dim-chip-row">${p.largo.map(l=>`<span class="dim-chip">${l} cm</span>`).join("")}</div>
    </div>

    <div class="sheet-section">
      <h4>Observaciones de pedido</h4>
      <p>${p.observaciones}</p>
    </div>

    <div class="sheet-price-card">
      <div class="lbl">Precio</div>
      <div class="val" id="sheetPriceVal">${price ? Number(price).toFixed(2)+" €" : "Sin fijar"}</div>
      <input id="sheetPriceInput" type="text" inputmode="decimal" placeholder="Introduce un precio, ej. 649.00" value="${price || ""}">
      <button class="save-btn" id="sheetPriceSave">Guardar precio</button>
    </div>
  `;

  document.getElementById("sheetPriceSave").addEventListener("click", ()=>{
    const raw = document.getElementById("sheetPriceInput").value.replace(",",".");
    const num = parseFloat(raw);
    if(isNaN(num)) return;
    prices[p.id] = num;
    localStorage.setItem("drapsaten_prices", JSON.stringify(prices));
    document.getElementById("sheetPriceVal").textContent = num.toFixed(2)+" €";
    render();
  });

  document.getElementById("btnDownloadFicha").addEventListener("click", ()=>downloadOrShareFicha(p, "download"));
  document.getElementById("btnShareFicha").addEventListener("click", ()=>downloadOrShareFicha(p, "share"));

  sheet.classList.add("open");
  document.body.style.overflow = "hidden";
}
document.getElementById("sheetBack").addEventListener("click", ()=>{
  sheet.classList.remove("open");
  document.body.style.overflow = "";
});
document.getElementById("sheetExpand").addEventListener("click", ()=>{
  if(currentProduct) openFullscreen(currentProduct.img);
});

/* ================= EXPORT / SHARE FICHA ================= */

  const price = prices[p.id];
  return `
    <div class="ec-header">
      <img src="${document.querySelector('.brand-mark img').src}" alt="">
      <div>
        <div class="ec-title">DRAPSATEN CORTE</div>
        <div class="ec-sub">SweetBedding · Ficha de producto</div>
      </div>
    </div>
    <img class="ec-hero" src="${p.img}" alt="${p.name}">
    <div class="ec-body">
      <div class="ec-eyebrow">${p.fabricacion}</div>
      <div class="ec-name">${p.name}</div>
      <div class="ec-fw">${p.firmeza} · ${p.altura} cm de altura</div>

      <div class="ec-row">
        <div class="ec-col" style="flex:1;">
          <h4>Núcleo</h4>
          ${p.nucleo.map(t=>`<p>${t}</p>`).join("")}

    </div>
    <div class="ec-footer">DRAPSATEN CORTE · MCS Representaciones</div>
  `;
}

function slugify(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
}

async function generateFichaBlob(p){
  const container = document.getElementById("exportCard");
  container.innerHTML = buildExportCardHTML(p);
  // wait for images inside the export card to load
  const imgs = container.querySelectorAll("img");
  await Promise.all([...imgs].map(img=>{
    if(img.complete) return Promise.resolve();
    return new Promise(res=>{ img.onload = res; img.onerror = res; });
  }));
  const canvas = await html2canvas(container, {backgroundColor: "#fdfbf6", scale: 2, useCORS: true});
  return await new Promise(res=>canvas.toBlob(res, "image/png"));
}

async function downloadOrShareFicha(p, mode){
  const btnId = mode === "share" ? "btnShareFicha" : "btnDownloadFicha";
  const btn = document.getElementById(btnId);
  const originalHTML = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = "Generando…";
  try{
    const blob = await generateFichaBlob(p);
    const filename = `ficha-${slugify(p.name)}.png`;

    if(mode === "share" && navigator.canShare && navigator.canShare({files:[new File([blob], filename, {type:"image/png"})]})){
      const file = new File([blob], filename, {type:"image/png"});
      await navigator.share({
        files: [file],
        title: `${p.name} · DRAPSATEN CORTE`,
        text: `Ficha de ${p.name} — DRAPSATEN CORTE`
      });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      if(mode === "share"){
        alert("Tu navegador no permite compartir directamente: la ficha se ha descargado, puedes compartirla desde tus archivos.");
      }
    }
  } catch(err){
    if(err && err.name !== "AbortError"){
      alert("No se pudo generar la ficha. Inténtalo de nuevo.");
    }
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalHTML;
  }
}

/* ================= FULLSCREEN IMAGE VIEWER ================= */
const fsViewer = document.getElementById("fsViewer");
const fsImg = document.getElementById("fsImg");
function openFullscreen(src){
  fsImg.src = src;
  fsViewer.classList.add("open");
}
document.getElementById("fsClose").addEventListener("click", ()=>{
  fsViewer.classList.remove("open");
});

/* ================= MODELS QUICK GRID ================= */
function renderModelsGrid(){
  const grid = document.getElementById("modelsGrid");
  grid.innerHTML = "";
  PRODUCTS.forEach(p=>{
    const tile = document.createElement("div");
    tile.className = "model-tile";
    tile.innerHTML = `
      <div class="tile-name">${p.name}</div>
      <div class="tile-sub">${p.altura} cm · ${p.firmeza.split(" ")[0]}</div>
    `;
    tile.addEventListener("click", ()=>openSheet(p.id));
    grid.appendChild(tile);
  });
}
renderModelsGrid();

/* ================= FIRST RENDER ================= */
render();
</script>
