<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex, nofollow">
<title>Suscripción confirmada — MCS Representaciones</title>
<link rel="icon" type="image/png" sizes="32x32" href="./images/icon-32.png">
<link rel="stylesheet" href="./fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#FAF8F5;color:#121212;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{max-width:520px;text-align:center}
.logo{font-family:'Playfair Display',serif;font-size:28px;font-weight:600;letter-spacing:1px;color:#C1633D}
h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:600;margin:24px 0 12px}
p{font-size:15px;color:#5A534D}
a.btn{display:inline-block;margin-top:28px;background:#121212;color:#fff;text-decoration:none;padding:14px 26px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .logo{display:inline-block;font-size:0;line-height:0;border-radius:2px;overflow:hidden}
  .logo img{display:block;height:84px;width:auto}
  @media (max-width:640px){.logo img{height:66px}}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><img src="./images/logo-mcs-h.png" alt="MCS Representaciones" width="480" height="201"></div>
  <h1 data-gl="Subscrición confirmada">Suscripción confirmada</h1>
  <p data-gl="Gracias por suscribirte. Desde ahora recibirás nuestras novidades por correo. Puedes darte de baja en cualquier momento desde el enlace que aparece al final de cada mensaje.">Gracias por suscribirte. Desde ahora recibirás nuestras novedades por correo. Puedes darte de baja en cualquier momento desde el enlace que aparece al final de cada mensaje.</p>
  <a class="btn" href="./" data-gl="Volver á web">Volver a la web</a>
</div>
<script>
try{if(localStorage.getItem("mcsLang")==="gl"){document.documentElement.lang="gl";document.title="Subscrición confirmada — MCS Representaciones";
document.querySelectorAll("[data-gl]").forEach(function(el){el.innerHTML=el.getAttribute("data-gl")});
document.querySelector("p").textContent="Grazas por subscribirte. Desde agora recibirás as nosas novidades por correo. Podes darte de baixa en calquera momento desde a ligazón que aparece ao final de cada mensaxe."}}catch(e){}
</script>
</body>
</html>
