<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCS · Tarifas KingSofa</title>
<link rel="manifest" href="./manifest-kingsofa.json">
<link rel="icon" type="image/png" sizes="32x32" href="./images/icon-kingsofa-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./images/icon-kingsofa-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tarifas KingSofa">
<meta name="theme-color" content="#141311">
<style>
  :root{
    --bg:#F4F1EC;
    --panel:#FFFFFF;
    --ink:#181614;
    --ink-soft:#6E655C;
    --line:#E4DED2;
    --accent:#C0221B;
    --accent-dark:#8F1712;
    --accent-soft:#F5D9D7;
    --ok:#4B6B4F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:640px;margin:0 auto;padding-bottom:90px;}
  header.top{
    position:sticky;top:0;z-index:20;
    background:#141311;
    color:#F4F1EC;
    padding:14px 16px 12px;
  }
  .top-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
  }
  header.top h1{
    margin:0;
    font-size:19px;
    font-weight:700;
    letter-spacing:.2px;
  }
  header.top .sub{
    font-size:12px;
    color:#C7BEB0;
    margin-top:2px;
    letter-spacing:.5px;
    text-transform:uppercase;
  }
  .settings-btn{
    border:none;
    background:rgba(255,255,255,.08);
    color:#F4F1EC;
    width:34px;height:34px;
    border-radius:50%;
    font-size:16px;
    line-height:1;
    flex-shrink:0;
  }
  .settings-btn:active{background:rgba(255,255,255,.18);}

  .brand-strip{
    background:#111;
    margin:0;
    padding:8px 16px 14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .ks-logo-img{
    width:34px;height:34px;
    border-radius:50%;
    flex-shrink:0;
    object-fit:cover;
  }
  .brand-strip .name{
    color:#fff;font-size:15px;font-weight:600;letter-spacing:.3px;
  }
  .brand-strip .name b{color:var(--accent);}

  .config{
    background:var(--panel);
    margin:14px 16px 0;
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
  }
  .config-row{
    display:flex;
    gap:10px;
    align-items:center;
  }
  .config label{
    flex:1;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .config input{
    width:92px;
    padding:7px 8px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:15px;
    text-align:right;
    background:#FBF9F4;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .config .saved{
    font-size:11px;
    color:var(--ok);
    text-align:right;
    height:14px;
    margin-top:4px;
    opacity:0;
    transition:opacity .25s;
  }
  .config .saved.show{opacity:1;}

  .search-wrap{
    margin:14px 16px 6px;
    position:sticky;
    top:64px;
    z-index:15;
  }
  .search-wrap input{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid var(--line);
    font-size:15px;
    background:var(--panel);
    box-shadow:0 2px 6px rgba(20,19,17,.06);
  }
  .search-wrap input:focus{outline:2px solid var(--accent);}

  .hint{
    margin:8px 16px 4px;
    font-size:12.5px;
    color:var(--ink-soft);
  }

  .model-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin:8px 16px;
  }
  .model-btn{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 10px;
    text-align:center;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
  }
  .model-btn:active{background:var(--accent-soft);}
  .model-btn .count{
    display:block;
    font-weight:400;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .back-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:14px 16px 6px;
  }
  .back-btn{
    border:none;background:none;
    color:var(--accent-dark);
    font-size:13.5px;
    font-weight:600;
    padding:4px 0;
  }
  .facets{
    margin:0 16px 4px;
  }
  .facet-group{
    margin-bottom:10px;
  }
  .facet-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .chip{
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:20px;
    padding:6px 12px;
    font-size:12.5px;
    color:var(--ink);
  }
  .chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  .list{margin:8px 16px;}
  .item{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:6px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .item:active{background:var(--accent-soft);}
  .item .t{font-size:13.5px;line-height:1.35;}
  .item .p1{font-size:12.5px;color:var(--accent-dark);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;}

  .empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:13.5px;
    padding:40px 20px;
  }

  .overlay{
    position:fixed;inset:0;
    background:rgba(20,19,17,.5);
    z-index:50;
    display:none;
    align-items:flex-end;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--panel);
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    border-radius:18px 18px 0 0;
    padding:18px 18px 28px;
    animation:up .18s ease-out;
  }
  @keyframes up{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet h2{
    font-size:17px;
    margin:0 0 2px;
    padding-right:30px;
  }
  .sheet .meta{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .close-btn{
    position:absolute;
    right:16px;
    top:16px;
    width:32px;height:32px;
    border-radius:50%;
    border:none;
    background:var(--accent-soft);
    color:var(--accent-dark);
    font-size:16px;
    line-height:1;
  }
  .sheet-inner{position:relative;}

  table.tramos{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
  }
  table.tramos th{
    text-align:right;
    font-size:10.5px;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding:4px 6px;
    border-bottom:1px solid var(--line);
  }
  table.tramos th:first-child{text-align:left;}
  table.tramos td{
    padding:9px 6px;
    text-align:right;
    border-bottom:1px solid var(--line);
    font-variant-numeric:tabular-nums;
    font-weight:700;
    color:var(--ink);
  }
  table.tramos td:first-child{
    text-align:left;
    font-weight:400;
    color:var(--ink-soft);
  }
  .copy-row{
    display:flex;
    justify-content:flex-end;
    padding:6px;
  }
  .copy-row button{
    border:none;
    background:none;
    color:var(--accent);
    font-size:11px;
    padding:2px 4px;
    font-weight:600;
  }
  .foot-note{
    margin-top:14px;
    font-size:11.5px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .toast{
    position:fixed;
    bottom:18px;left:50%;
    transform:translateX(-50%);
    background:#141311;
    color:#F4F1EC;
    padding:9px 16px;
    border-radius:20px;
    font-size:13px;
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="top-row">
      <div>
        <h1>Tarifas KingSofa</h1>
        <div class="sub">MCS Representaciones</div>
      </div>
      <button id="settingsBtn" class="settings-btn" aria-label="Ajustes">⚙</button>
    </div>
  </header>

  <div class="brand-strip">
    <img src="./images/logo-kingsofa-icon.png" alt="KingSofa" class="ks-logo-img">
    <div class="name">King<b>S</b>ofa</div>
  </div>

  <div class="config" id="configPanel" style="display:none;">
    <div class="config-row">
      <label for="valorPunto">Valor punto (€)</label>
      <input id="valorPunto" type="number" step="0.01" inputmode="decimal">
    </div>
    <div class="saved" id="savedMsg">Guardado</div>
  </div>

  <div class="search-wrap">
    <input id="search" type="text" placeholder="Búsqueda libre (opcional)…" autocomplete="off">
  </div>
  <div class="hint" id="resultCount"></div>

  <div id="modelStep">
    <div class="hint" style="margin-top:10px;">Elige una colección / modelo</div>
    <div class="model-grid" id="modelGrid"></div>
  </div>

  <div id="backRow" class="back-row" style="display:none;">
    <button class="back-btn" id="backBtn">‹ Cambiar modelo</button>
    <span class="hint" id="modelName" style="margin:0;"></span>
  </div>
  <div class="facets" id="facets" style="display:none;"></div>

  <div class="list" id="list"></div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-inner">
      <button class="close-btn" id="closeBtn">✕</button>
      <h2 id="modalTitle"></h2>
      <div class="meta" id="modalMeta"></div>
      <table class="tramos">
        <thead>
          <tr>
            <th>Serie</th>
            <th>Puntos</th>
            <th>Precio</th>
          </tr>
        </thead>
        <tbody id="modalBody"></tbody>
      </table>
      <div class="copy-row"><button id="copyBtn">Copiar precios</button></div>
      <div class="foot-note">
        Precio = Puntos × Valor punto. El valor del punto es editable arriba (⚙) y se recuerda en este dispositivo. Las medidas pueden variar ±1 cm por módulo.
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

// ---------- valor punto ----------
const fmtEUR = n => n.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
const fmtPts = n => n.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2});

const VALOR_PUNTO_DEFAULT = 33.55;
let valorPunto = parseFloat(localStorage.getItem('ks_valor_punto')) || VALOR_PUNTO_DEFAULT;

const valorPuntoInput = document.getElementById('valorPunto');
valorPuntoInput.value = valorPunto;

const settingsBtn = document.getElementById('settingsBtn');
const configPanel = document.getElementById('configPanel');
settingsBtn.onclick = () => {
  configPanel.style.display = configPanel.style.display === 'none' ? 'block' : 'none';
};

let saveTimeout = null;
valorPuntoInput.addEventListener('input', (e) => {
  const v = parseFloat(e.target.value);
  if (!isNaN(v) && v > 0){
    valorPunto = v;
    localStorage.setItem('ks_valor_punto', String(v));
    const savedMsg = document.getElementById('savedMsg');
    savedMsg.classList.add('show');
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => savedMsg.classList.remove('show'), 1200);
    renderCurrentList();
    if (currentProduct) openModal(currentProduct, true);
  }
});

const fmt = n => fmtEUR(n * valorPunto);

// ---------- helpers de escape ----------
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------- agrupación de modelos ----------
// items con subcol -> agrupados bajo coleccion > subcol (modelo)
// items sin subcol -> modelo = coleccion directamente
const groups = {};      // coleccion -> {modelo: count}
const standalone = {};  // coleccion -> count
PRODUCTOS.forEach(p => {
  if (p.subcol) {
    groups[p.coleccion] = groups[p.coleccion] || {};
    groups[p.coleccion][p.subcol] = (groups[p.coleccion][p.subcol]||0) + 1;
  } else {
    standalone[p.coleccion] = (standalone[p.coleccion]||0) + 1;
  }
});

let currentModel = null; // {coleccion, subcol}
let facetState = { tipo:null, mecanismo:null, medida:null };

const modelGridEl = document.getElementById('modelGrid');
const modelStepEl = document.getElementById('modelStep');
const backRowEl = document.getElementById('backRow');
const modelNameEl = document.getElementById('modelName');
const facetsEl = document.getElementById('facets');
const listEl = document.getElementById('list');
const resultCountEl = document.getElementById('resultCount');
const searchEl = document.getElementById('search');

function buildModelGrid(){
  let html = '';
  Object.keys(standalone).sort().forEach(m => {
    html += `<button class="model-btn" data-coleccion="${escapeHtml(m)}" data-subcol="">${escapeHtml(m)}<span class="count">${standalone[m]} medidas</span></button>`;
  });
  modelGridEl.innerHTML = html;

  // grupos con subcolecciones: mostramos encabezado + grid propio debajo del grid principal
  const groupKeys = Object.keys(groups).sort();
  groupKeys.forEach(g => {
    const h = document.createElement('div');
    h.className = 'hint';
    h.style.margin = '14px 16px 4px';
    h.style.fontWeight = '700';
    h.style.color = 'var(--accent-dark)';
    h.style.textTransform = 'uppercase';
    h.style.fontSize = '12px';
    h.style.letterSpacing = '.5px';
    h.textContent = g;
    modelStepEl.appendChild(h);

    const grid = document.createElement('div');
    grid.className = 'model-grid';
    Object.keys(groups[g]).sort().forEach(m => {
      const btn = document.createElement('button');
      btn.className = 'model-btn';
      btn.innerHTML = escapeHtml(m) + '<span class="count">' + groups[g][m] + ' medidas</span>';
      btn.addEventListener('click', () => selectModel(g, m));
      grid.appendChild(btn);
    });
    modelStepEl.appendChild(grid);
  });

  modelGridEl.querySelectorAll('.model-btn').forEach(btn => {
    btn.addEventListener('click', () => selectModel(btn.dataset.coleccion, null));
  });
}

function selectModel(coleccion, subcol){
  currentModel = {coleccion, subcol};
  facetState = { tipo:null, mecanismo:null, medida:null };
  modelStepEl.style.display = 'none';
  backRowEl.style.display = 'flex';
  modelNameEl.textContent = subcol ? subcol : coleccion;
  facetsEl.style.display = 'block';
  searchEl.value = '';
  renderFacetsAndList();
}

document.getElementById('backBtn').onclick = () => {
  currentModel = null;
  modelStepEl.style.display = 'block';
  backRowEl.style.display = 'none';
  facetsEl.style.display = 'none';
  listEl.innerHTML = '';
  resultCountEl.textContent = '';
};

function itemsForModel(){
  if (!currentModel) return [];
  return PRODUCTOS.filter(p => {
    if (p.coleccion !== currentModel.coleccion) return false;
    if (currentModel.subcol && p.subcol !== currentModel.subcol) return false;
    return true;
  });
}

function applyFacets(items){
  return items.filter(p => {
    if (facetState.tipo && p.tipo !== facetState.tipo) return false;
    if (facetState.mecanismo && p.mecanismo !== facetState.mecanismo) return false;
    if (facetState.medida && !(p.medidas||[]).includes(facetState.medida)) return false;
    return true;
  });
}

function renderFacetsAndList(){
  const base = itemsForModel();

  function distinct(getter){
    const s = new Set();
    base.forEach(p => { const v = getter(p); if (v!==null && v!==undefined) s.add(v); });
    return [...s];
  }

  const tipos = distinct(p=>p.tipo);
  const mecanismos = distinct(p=>p.mecanismo);
  const medidasSet = new Set();
  base.forEach(p => (p.medidas||[]).forEach(m=>medidasSet.add(m)));
  const medidas = [...medidasSet].sort((a,b)=>a-b);

  let html = '';
  function chipGroup(label, values, current, key){
    if (values.length <= 1) return;
    html += `<div class="facet-group"><div class="facet-label">${label}</div><div class="chip-row">`;
    html += `<button class="chip ${current===null?'active':''}" data-facet="${key}" data-value="">Todos</button>`;
    values.sort((a,b)=> typeof a==='number' ? a-b : String(a).localeCompare(String(b),'es')).forEach(v => {
      html += `<button class="chip ${current===v?'active':''}" data-facet="${key}" data-value="${escapeHtml(String(v))}">${escapeHtml(String(v))}${key==='medida'?' cm':''}</button>`;
    });
    html += `</div></div>`;
  }

  chipGroup('Tipo', tipos, facetState.tipo, 'tipo');
  chipGroup('Mecanismo', mecanismos, facetState.mecanismo, 'mecanismo');
  chipGroup('Medida', medidas, facetState.medida, 'medida');

  facetsEl.innerHTML = html;
  facetsEl.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const key = chip.dataset.facet;
      const raw = chip.dataset.value;
      facetState[key] = raw === '' ? null : (key==='medida' ? parseInt(raw) : raw);
      renderFacetsAndList();
    });
  });

  renderList(applyFacets(base));
}

function renderCurrentList(){
  if (searchEl.value.trim()){
    renderFreeSearch(searchEl.value);
  } else if (currentModel){
    renderList(applyFacets(itemsForModel()));
  }
}

function renderList(items){
  listEl.innerHTML = '';
  if (!items.length){
    listEl.innerHTML = '<div class="empty">Ninguna composición cumple esos filtros. Prueba a quitar alguno.</div>';
    resultCountEl.textContent = '0 resultados';
    return;
  }
  resultCountEl.textContent = items.length + ' resultado' + (items.length===1?'':'s');
  items.forEach(p => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = '<div class="t">' + escapeHtml(p.titulo) + '</div><div class="p1">' + fmt(p.precios["1"]) + '</div>';
    div.onclick = () => openModal(p);
    listEl.appendChild(div);
  });
}

// ---------- búsqueda libre ----------
function renderFreeSearch(text){
  const q = (text||'').trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  if (!words.length){
    listEl.innerHTML = '';
    resultCountEl.textContent = '';
    return;
  }
  const items = PRODUCTOS.filter(p => {
    const hay = [p.titulo, p.coleccion, p.subcol, p.tipo, p.mecanismo].filter(Boolean).join(' ').toLowerCase();
    return words.every(w => hay.includes(w));
  }).slice(0, 200);
  renderList(items);
  if (items.length) resultCountEl.textContent = items.length + (items.length===200?'+':'') + ' resultado(s)';
}

let debounceT = null;
searchEl.addEventListener('input', () => {
  clearTimeout(debounceT);
  debounceT = setTimeout(() => {
    if (searchEl.value.trim()){
      currentModel = null;
      modelStepEl.style.display = 'none';
      backRowEl.style.display = 'none';
      facetsEl.style.display = 'none';
      renderFreeSearch(searchEl.value);
    } else if (!currentModel){
      modelStepEl.style.display = 'block';
      listEl.innerHTML = '';
      resultCountEl.textContent = '';
    }
  }, 120);
});

// ---------- Modal ----------
const overlay = document.getElementById('overlay');
const modalTitle = document.getElementById('modalTitle');
const modalMeta = document.getElementById('modalMeta');
const modalBody = document.getElementById('modalBody');
let currentProduct = null;

function openModal(p, keepOpen){
  currentProduct = p;
  modalTitle.textContent = p.titulo;
  modalMeta.textContent = (p.subcol ? p.subcol + ' · ' : '') + p.coleccion + ' · ' + p.tipo + ' · ' + p.mecanismo;
  modalBody.innerHTML = '';
  ['1','2','3','4'].forEach(s => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>Serie ' + s + '</td><td>' + fmtPts(p.precios[s]) + '</td><td>' + fmt(p.precios[s]) + '</td>';
    modalBody.appendChild(tr);
  });
  if (!keepOpen) overlay.classList.add('open');
}
document.getElementById('closeBtn').onclick = () => overlay.classList.remove('open');
overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });

document.getElementById('copyBtn').onclick = () => {
  if (!currentProduct) return;
  const p = currentProduct;
  const lines = [p.titulo, '(Valor punto: ' + fmtEUR(valorPunto) + ')'];
  ['1','2','3','4'].forEach(s => lines.push('Serie ' + s + ': ' + fmtPts(p.precios[s]) + ' pts = ' + fmt(p.precios[s])));
  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(() => showToast('Copiado'));
};

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1400);
}

buildModelGrid();
</script>
