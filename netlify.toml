[build]
  publish = "."
  command = "npm install && node scripts/build-static.mjs"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/crm/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/calculadora-essenzia.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/drapsaten-corte.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache, no-store, must-revalidate"

# Páginas internas: fuera de los buscadores (la cabecera sustituye a los Disallow de robots.txt,
# que eran públicos y además impedían a Google leer el noindex).

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/email/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

