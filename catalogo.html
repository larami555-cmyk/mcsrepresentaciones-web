<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Catálogo — MCS Representaciones</title>
<style>
  :root {
    --ink: #2c2c2a;
    --muted: #8a8880;
    --border: #e4e2da;
    --accent: #2c2c2a;
    --bg: #faf9f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 32px 20px 64px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
  }
  .filter-btn {
    padding: 9px 18px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--ink);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .filter-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
  }
  .card {
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
    border: 1px solid var(--border);
  }
  .card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
    background: #eee;
  }
  .card .label {
    padding: 10px 14px;
    font-size: 12px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .empty, .loading {
    text-align: center;
    color: var(--muted);
    padding: 60px 0;
    font-size: 14px;
  }
