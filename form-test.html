<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Prueba de formulario</title>
<style>body{font-family:Inter,Arial,sans-serif;max-width:460px;margin:40px auto;padding:0 20px;color:#121212}input,textarea,button{display:block;width:100%;margin:10px 0;padding:12px;font:inherit;box-sizing:border-box}button{background:#121212;color:#fff;border:0;cursor:pointer}.ok{background:#e6f4ea;padding:12px;color:#1e5c30}</style></head>
<body>
<h1>Prueba de formulario</h1>
<div class="ok" id="ok" style="display:none">Enviado. Mira Netlify → Forms → prueba.</div>
<form name="prueba" method="POST" action="/form-test.html?enviado=1" data-netlify="true" netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="prueba">
  <p style="display:none"><label>No rellenar: <input name="bot-field"></label></p>
  <input name="tienda" placeholder="Tienda" required>
  <input name="contacto" placeholder="Email o teléfono" required>
  <textarea name="mensaje" placeholder="Mensaje"></textarea>
  <button type="submit">Enviar prueba</button>
</form>
<script>if(location.search.indexOf("enviado")>-1)document.getElementById("ok").style.display="block"</script>
</body></html>
